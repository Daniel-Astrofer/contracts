name: Contracts CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compatibility:
    uses: Daniel-Astrofer/.github/.github/workflows/compatibility-ci.yml@516bc5cd5f0b748e61d3944cfa126fbf3315ed7d
    with:
      component: contracts

  java:
    uses: Daniel-Astrofer/.github/.github/workflows/java-ci.yml@2552ff2125c2d72accebe93804b8e139a52ded13
    with:
      gradle-arguments: test publishJavaPublicationToLocalBuildRepository

  rust:
    uses: Daniel-Astrofer/.github/.github/workflows/rust-ci.yml@2552ff2125c2d72accebe93804b8e139a52ded13
    with:
      enforce-format: true

  security:
    permissions:
      contents: read
      pull-requests: read # Required by dependency review on pull requests.
      security-events: write # Required to upload SARIF security findings.
    uses: Daniel-Astrofer/.github/.github/workflows/security-scan.yml@2552ff2125c2d72accebe93804b8e139a52ded13
